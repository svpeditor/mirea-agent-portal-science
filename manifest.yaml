id: science-agent
name: "Поиск научных статей"
version: "5.0.0"
category: "научная-работа"
icon: "🔬"
short_description: |
  Ищет РЕАЛЬНЫЕ статьи по теме сразу в пяти базах (CyberLeninka + arXiv +
  Crossref + Semantic Scholar + OpenAlex) через allowlist-прокси portal-api.
  LLM генерирует поисковые запросы (рус.+англ.), затем дедуплицирует,
  ранжирует и аннотирует найденное строго по реальным abstract'ам.
  CyberLeninka даёт русскоязычные журналы, OpenAlex — широкое покрытие.
  PDF открытого доступа (arXiv, CyberLeninka, OA по DOI) прикладывает
  файлами. Кликабельные ссылки + BibTeX. Агент НЕ выдумывает статьи: если
  реального ничего не нашлось — честно сообщает, а не фантазирует.

inputs:
  topic:
    type: textarea
    label: "Тема исследования"
    placeholder: "например, machine learning для медицинской диагностики"
    rows: 4
    required: true
  description:
    type: textarea
    label: "Описание (необязательно)"
    placeholder: "уточните контекст: подзадачи, методы, период - поможет точнее подобрать запросы"
    rows: 3
  max_papers:
    type: number
    label: "Сколько статей"
    default: 15
    min: 5
    max: 30
  language:
    type: radio
    label: "Язык аннотаций"
    options:
      - { value: "ru", label: "Русский" }
      - { value: "en", label: "Английский" }
    default: "ru"
  download_pdf:
    type: checkbox
    label: "Скачивать PDF открытого доступа"
    help: "Прикладывает файлы статей из открытых источников (arXiv, CyberLeninka, OA по DOI). Только легально открытые версии."
    default: true
  sort_by:
    type: radio
    label: "Сортировка"
    options:
      - { value: "relevance", label: "По релевантности (LLM-балл)" }
      - { value: "popularity", label: "По цитированиям (Semantic Scholar)" }
    default: "relevance"
  model:
    type: radio
    label: "Модель для ранжирования и аннотаций"
    help: "R1/Opus/Pro — точнее, медленнее. Haiku/mini/flash — быстрые."
    options:
      - { value: "deepseek/deepseek-r1", label: "DeepSeek-R1 (reasoning, рекомендуется)" }
      - { value: "anthropic/claude-haiku-4.5", label: "Claude Haiku 4.5 (быстро)" }
      - { value: "anthropic/claude-opus-4.7", label: "Claude Opus 4.7 (макс. качество)" }
      - { value: "openai/gpt-4o", label: "OpenAI GPT-4o" }
      - { value: "openai/gpt-4o-mini", label: "OpenAI GPT-4o mini (быстро)" }
      - { value: "google/gemini-2.5-pro", label: "Google Gemini 2.5 Pro" }
      - { value: "google/gemini-2.5-flash", label: "Google Gemini 2.5 Flash (быстро)" }
      - { value: "x-ai/grok-4.3", label: "xAI Grok 4.3" }
      - { value: "moonshotai/kimi-k2.6", label: "Kimi K2.6 (Moonshot)" }
    default: "deepseek/deepseek-r1"

files: {}

outputs:
  - id: report
    type: docx
    label: "Отчёт по теме"
    filename: "report.docx"
    primary: true
  - id: bibtex
    type: any
    label: "BibTeX источников"
    filename: "sources.bib"

runtime:
  docker:
    base_image: "python:3.12-slim"
    setup:
      - "pip install -r requirements.txt"
    entrypoint: ["python", "agent.py"]
  limits:
    max_runtime_minutes: 30
    max_memory_mb: 512
    max_cpu_cores: 1
  llm:
    provider: openrouter
    models:
      - "deepseek/deepseek-r1"
      - "anthropic/claude-haiku-4.5"
      - "anthropic/claude-opus-4.7"
      - "openai/gpt-4o"
      - "openai/gpt-4o-mini"
      - "google/gemini-2.5-pro"
      - "google/gemini-2.5-flash"
      - "x-ai/grok-4.3"
      - "moonshotai/kimi-k2.6"
